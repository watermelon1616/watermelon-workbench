<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚡ Watermelon 的工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Watermelon">
<meta name="theme-color" content="#FFE04D">
<link rel="stylesheet" href="css/style.css">
<!-- 安全策略：默认不加载任何外部脚本 / CDN / 字体 / 埋点。
     （已于 2026-08-03 移除 beacon.cdn.qq.com 埋点 SDK，它会把你的访问地址上报到第三方）
     仅当用户在「设置」中开启云端同步时，才会按需从 CDN 加载 supabase-js 客户端，
     用于把数据同步到你自己的 Supabase 项目（anon key 为公开密钥，由 RLS 保护数据安全）。 -->
<meta name="referrer" content="no-referrer">
</head>
<body>

<div class="app">
  <!-- ============ 左侧导航 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"></div>
      <div class="brand-text">
        <span class="bt-line">Watermelon</span>
        <span class="bt-line">的工作台</span>
      </div>
    </div>

    <nav id="nav"></nav>

    <div class="sidebar-foot">
      <div class="sync-status" id="syncStatus">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">未连接云端</span>
      </div>
      <div><span class="save-dot" id="saveDot"></span><span id="saveText">数据已保存在本机</span></div>
      <div id="savePath" style="margin-top:4px;word-break:break-all;font-size:10.5px;opacity:.75"></div>
      <button class="mini-btn" id="btnSettings">⚙️ 设置</button>
      <button class="mini-btn" id="btnExport">导出备份</button>
      <button class="mini-btn" id="btnImport">导入备份</button>
      <button class="mini-btn" id="btnMerge">合并导入</button>
      <button class="mini-btn install-btn" id="btnInstall" hidden>📲 安装到主屏幕</button>
      <input type="file" id="fileImport" accept=".json" hidden>
      <input type="file" id="fileMerge" accept=".json" hidden>
    </div>
  </aside>

  <!-- ============ 右侧主区 ============ -->
  <main class="main">
    <div class="page-head">
      <button class="menu-btn" id="menuBtn" aria-label="打开菜单">☰</button>
      <div class="page-title">
        <h1 id="pageTitle">待办事项</h1>
        <p id="pageSub"></p>
      </div>
      <div class="streak">
        <span class="streak-ico" id="streakIco">🔥</span>
        <div>
          <div class="streak-num"><span id="streakNum">0</span> <span style="font-size:13px;font-weight:600">天</span></div>
          <div class="streak-txt">已连续坚持 · <b id="streakBest">最长 0 天</b></div>
        </div>
      </div>
    </div>

    <div id="view"></div>
  </main>
</div>

<div class="drawer-mask" id="drawerMask"></div>

<div class="toast-box" id="toastBox"></div>
<div id="modalRoot"></div>

<!-- 语料库 -->
<script src="data/corpus-speaking.js"></script>
<script src="data/corpus-trade.js"></script>
<script src="data/corpus-client.js"></script>
<script src="data/corpus-listening.js"></script>
<script src="data/corpus-listening2.js"></script>
<script src="data/pod-finance.js"></script>
<script src="data/pod-money.js"></script>
<script src="data/pod-social.js"></script>
<script src="data/pod-growth.js"></script>
<script src="data/news-finance.js"></script>
<script src="data/news-politics.js"></script>
<script src="data/corpus-tcm.js"></script>
<script src="data/corpus-fitness.js"></script>

<!-- 核心 -->
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/utils.js"></script>
<script src="js/speech.js"></script>

<!-- 模块 -->
<script src="js/modules/todo.js"></script>
<script src="js/modules/piggy.js"></script>
<script src="js/modules/speaking.js"></script>
<script src="js/modules/listening.js"></script>
<script src="js/modules/podcast.js"></script>
<script src="js/modules/news.js"></script>
<script src="js/modules/tcm.js"></script>
<script src="js/modules/fitness.js"></script>
<script src="js/modules/home.js"></script>
<script src="js/ai.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
<script src="js/app.js"></script>
</body>
</html>
